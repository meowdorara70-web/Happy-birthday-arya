ĺ<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>For Arya 🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ambient background layers -->
<div class="bg-scene">
  <div class="bg-gradient"></div>
  <div class="bg-glow bg-glow--pink"></div>
  <div class="bg-glow bg-glow--lavender"></div>
  <canvas id="fx-canvas"></canvas>
  <div class="stars" id="stars"></div>
  <div class="moon" id="moon"></div>
  <div class="sunrise" id="sunrise"></div>
</div>

<!-- Music toggle -->
<button id="musicToggle" class="music-toggle glass" aria-label="Play music">
  <svg id="iconPlay" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
  <svg id="iconPause" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
</button>
<audio id="bgMusic" loop preload="none">
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<main class="stage" id="stage">

  <!-- SCENE 1: ENVELOPE -->
  <section class="scene scene--envelope is-active" id="scene-envelope">
    <p class="eyebrow">a little something for</p>
    <h1 class="name-title">Arya</h1>
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope" id="envelope">
        <div class="envelope__back"></div>
        <div class="letter-peek">
          <div class="letter-peek__shimmer"></div>
        </div>
        <div class="envelope__flap"></div>
        <div class="envelope__front-left"></div>
        <div class="envelope__front-right"></div>
        <div class="envelope__seal" id="seal">
          <span>A</span>
        </div>
      </div>
    </div>
    <p class="tap-hint">tap the seal to open</p>
  </section>

  <!-- SCENE 2: LETTER PAGES -->
  <section class="scene scene--letter" id="scene-letter">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="letter-card glass" id="letterCard">
      <div class="letter-pages" id="letterPages"><!-- injected by script.js --></div>
    </div>
    <div class="nav-row">
      <button class="nav-btn nav-btn--ghost" id="btnBack">Back</button>
      <span class="page-count" id="pageCount">1 / 1</span>
      <button class="nav-btn nav-btn--solid" id="btnNext">Next</button>
    </div>
  </section>

  <!-- SCENE 3: PHOTO -->
  <section class="scene scene--photo" id="scene-photo">
    <p class="eyebrow">a memory</p>
    <div class="photo-frame glass">
      <div class="photo-placeholder" id="photoPlaceholder">
        <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>your photo here</span>
      </div>
      <img id="photoImg" alt="" class="photo-img" />
    </div>
    <button class="nav-btn nav-btn--solid" id="btnPhotoNext">Continue</button>
  </section>

  <!-- SCENE 4: CAKE -->
  <section class="scene scene--cake" id="scene-cake">
    <p class="eyebrow">make a wish</p>
    <h2 class="scene-title">Happy Birthday</h2>
    <div class="cake-wrap" id="cakeWrap">
      <div class="cake">
        <div class="cake__flame" id="cakeFlame"></div>
        <div class="cake__candle"></div>
        <div class="cake__tier cake__tier--top">
          <span class="drip"></span><span class="drip"></span><span class="drip"></span>
        </div>
        <div class="cake__tier cake__tier--bottom">
          <span class="drip"></span><span class="drip"></span><span class="drip"></span><span class="drip"></span>
        </div>
        <div class="cake__plate"></div>
      </div>
    </div>
    <p class="tap-hint" id="cakeHint">tap the flame to blow out the candle</p>
    <button class="nav-btn nav-btn--solid is-hidden" id="btnCakeNext">Continue</button>
  </section>

  <!-- SCENE 5: GIFT -->
  <section class="scene scene--gift" id="scene-gift">
    <p class="eyebrow">one more thing</p>
    <div class="gift-wrap" id="giftWrap">
      <div class="gift">
        <div class="gift__lid"><div class="gift__ribbon-top"></div></div>
        <div class="gift__box"><div class="gift__ribbon-v"></div><div class="gift__ribbon-h"></div></div>
        <div class="gift__glow"></div>
      </div>
    </div>
    <p class="tap-hint" id="giftHint">tap the gift to open</p>
    <button class="nav-btn nav-btn--solid is-hidden" id="btnGiftNext">Continue</button>
  </section>

  <!-- SCENE 6: ENDING -->
  <section class="scene scene--ending" id="scene-ending">
    <p class="eyebrow">4 August</p>
    <h2 class="ending-title">wishing you a beautiful year ahead,<br><span>Arya</span></h2>
    <div class="ending-glimmer"></div>
    <button class="nav-btn nav-btn--ghost" id="btnReplay">Read again</button>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
